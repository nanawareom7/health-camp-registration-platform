# ============================================================================
# Example application configuration
# Health Camp Registration and Deployment Platform
# ============================================================================
#
# This file contains ONLY safe placeholders and environment-variable overrides.
# It holds NO real secrets. Real credentials must be supplied through environment
# variables (or an external secrets manager) and must never be committed to the
# repository.
#
# Note: the application does not connect to MySQL until the persistence layer is
# implemented; these values are prepared for when the registration workflow is built.
# ============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: health-camp-registration-platform

  datasource:
    # MySQL target database. Override DB_URL / DB_USERNAME / DB_PASSWORD in the environment.
    url: "${DB_URL:jdbc:mysql://localhost:3306/health_camp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.healthcamp: INFO
    org.hibernate.SQL: WARN
