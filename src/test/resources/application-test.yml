# ============================================================================
# Test profile configuration
# ============================================================================
#
# Used by automated tests (selected with @ActiveProfiles("test")).
# Runs against an in-memory H2 database in MySQL compatibility mode so the test
# suite does not require a running MySQL server.
# ============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
